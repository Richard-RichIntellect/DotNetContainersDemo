# The "base" compose file — what an image is called and how to build it.
# This is the part Visual Studio's Container Orchestrator Support
# generates automatically for the API project; the "db" service (SQL
# Server) is added by hand, since a database dependency is specific to
# this demo, not something the wizard knows to add.
#
# Split into docker-compose.yml + docker-compose.override.yml on purpose:
# this file is what you'd keep if you ever pushed images to a real
# registry for a team to share; docker-compose.override.yml holds the
# local-dev-only bits (ports, plaintext passwords, bind mounts) that
# should never follow the image anywhere.
services:
  taskboard.api:
    image: ${DOCKER_REGISTRY-}taskboardapi
    build:
      context: .
      dockerfile: src/TaskBoard.Api/Dockerfile

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    volumes:
      - taskboard-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  taskboard-db-data:
